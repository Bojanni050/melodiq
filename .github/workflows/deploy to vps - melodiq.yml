name: Deploy to VPS - MelodIQ

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e

            cd /var/www/vhosts/melodiq.nl/melodiq

            # .env is no longer tracked in git; keep the server's copy across the
            # hard reset (older commits tracked it, so the reset would delete it).
            [ -f .env ] && cp .env /tmp/melodiq.env.bak || true

            git fetch origin
            git reset --hard origin/main

            [ -f .env ] || { [ -f /tmp/melodiq.env.bak ] && cp /tmp/melodiq.env.bak .env; } || true

            docker compose pull || true
            docker compose up -d --build

            docker image prune -f

            docker compose ps